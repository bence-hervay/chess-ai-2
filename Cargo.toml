[package]
name = "selfplay-lab"
version = "0.1.0"
edition = "2021"
description = "Minimal CPU-first self-play game AI research lab"
license = "MIT"

[lib]
name = "selfplay_lab"
path = "src/lib.rs"

[[bin]]
name = "lab"
path = "src/bin/lab.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1"
burn = { version = "0.21", default-features = false, features = ["std", "ndarray", "autodiff"] }

[dev-dependencies]
proptest = "1"

[profile.release]
debug = true
